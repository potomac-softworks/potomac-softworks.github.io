
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Potomac Softworks</title>
<meta name="description" content="Potomac Softworks. We write software. Rockville, Maryland.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:wght@400;700&family=Public+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1d2b33;  --ink-soft: #3a474e;  --paper: #f6f7f5;
    --heron: #2b5d56;  --silt: #8a9499;  --rule: thin solid #1d2b3324;

    --serif: 'Libre Caslon Text', serif;
    --sans: 'Public Sans', system-ui, sans-serif;
    --text-xs: 0.72rem;  --text-sm: 0.85rem;  --text-base: 1.0625rem;
    --text-lg: 1.15rem;  --text-hero: clamp(3.2rem, 18vw, 8.5rem);

    --space-1: 1rem;
    --space-2: 1.5rem;
    --space-3: 2.25rem;
    --space-4: clamp(2.5rem, 6vw, 3.5rem);
    --space-5: clamp(2.25rem, 6vw, 5.25rem);

    --gutter: clamp(1.25rem, 4vw, 1.75rem);
    --page: 72.5rem;
  }

  * { margin: 0; }

  body {
    min-height: 100svh;
    display: grid;
    grid-template-rows: auto 1fr auto auto;
    font: var(--text-base)/1.6 var(--sans);
    color: var(--ink);
    background: var(--paper);
  }

  a { color: inherit; text-underline-offset: 0.25em; }
  a:hover { color: var(--heron); }

  /* utilities */
  .wrap { width: min(100% - 2 * var(--gutter), var(--page)); margin-inline: auto; }
  .row  { display: flex; justify-content: space-between; align-items: baseline; gap: var(--space-1); flex-wrap: wrap; }
  .flow > * + * { margin-block-start: var(--flow, var(--space-3)); }
  .py-2 { padding-block: var(--space-2); }
  .py-4 { padding-block: var(--space-4); }

  /* page */
  .wordmark { font: 700 var(--text-base) var(--serif); text-decoration: none; }
  header a + a { font-size: var(--text-sm); font-weight: 500; }

  main { display: grid; align-content: center; }
  h1 { font: 400 var(--text-hero)/1.05 var(--serif); letter-spacing: -0.015em; }
  h1 span { color: var(--heron); }
  main p { max-width: 46ch; color: var(--ink-soft); }

  .clients { border-top: var(--rule); --flow: var(--space-2); }
  .clients h2 { font-size: var(--text-xs); font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: var(--silt); }
  .clients ul { padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: var(--space-2) var(--space-5); font: var(--text-lg) var(--serif); opacity: 0.55; }

  footer { border-top: var(--rule); font-size: var(--text-sm); color: var(--silt); }
</style>
</head>
<body>

<header class="py-2">
  <div class="wrap row">
    <a class="wordmark" href="#">Potomac Softworks</a>
    <a href="mailto:hello@potomacsoftworks.com">hello@potomacsoftworks.com</a>
  </div>
</header>

<main class="py-4">
  <div class="wrap flow">
    <h1>We write<br>software<span>.</span></h1>
    <p>Bespoke systems, consulting, and subcontracting for organizations with hard problems. Based in Rockville, Maryland.</p>
  </div>
</main>

<section class="clients py-4" aria-label="Our clients">
  <div class="wrap flow">
    <h2>Our clients</h2>
    <ul>
      <li title="US Environmental Protection Agency">EPA</li>
      <li title="National Cancer Institute">NCI</li>
      <li title="National Institutes of Health">NIH</li>
      <li title="SRC, Inc.">SRC,&nbsp;Inc.</li>
    </ul>
  </div>
</section>

<footer class="py-2">
  <div class="wrap row">
    <span>© 2026 Potomac Softworks</span>
    <a href="mailto:hello@potomacsoftworks.com">Get in touch</a>
  </div>
</footer>

</body>
</html>
